<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unplug DOOH Engine - Operator Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">⚡ UNPLUG DOOH ENGINE</h1>
                <p class="text-xs text-gray-400">Static Operator Console & Screen Adjuster</p>
            </div>
            <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-3 py-1 rounded-full font-mono">
                GitHub Pages Active
            </span>
        </div>

        <!-- Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
                <p class="text-xs text-gray-400">Total Sites</p>
                <h2 id="totalSites" class="text-2xl font-bold text-white">0</h2>
            </div>
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
                <p class="text-xs text-gray-400">Online Sites</p>
                <h2 id="onlineSites" class="text-2xl font-bold text-emerald-400">0</h2>
            </div>
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
                <p class="text-xs text-gray-400">Offline Sites</p>
                <h2 id="offlineSites" class="text-2xl font-bold text-red-400">0</h2>
            </div>
        </div>

        <!-- Form Tambah Site Baru -->
        <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl">
            <h2 class="text-sm font-semibold text-gray-300 mb-3">[ + ] Tambah & Atur Site Kampanye</h2>
            <form id="addSiteForm" class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <input type="text" id="clientInput" placeholder="Client Slug (contoh: brand-kopi)" required 
                    class="bg-gray-950 border border-gray-800 text-sm rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                <input type="text" id="siteInput" placeholder="Site Slug (contoh: sudirman-01)" required 
                    class="bg-gray-950 border border-gray-800 text-sm rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                <select id="resInput" class="bg-gray-950 border border-gray-800 text-sm rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    <option value="1920x1080">Landscape (1920x1080)</option>
                    <option value="1080x1920">Portrait (1080x1920)</option>
                </select>
                <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold text-sm px-4 py-2 rounded transition">
                    + Simpan Site
                </button>
            </form>
        </div>

        <!-- Tabel Kontrol Site -->
        <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl overflow-hidden">
            <h2 class="text-sm font-semibold text-gray-300 mb-4">🖥️ daftar Videotron & Status Kontrol</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-gray-800 text-gray-400 text-xs uppercase bg-gray-950">
                            <th class="p-3">Client</th>
                            <th class="p-3">Site ID</th>
                            <th class="p-3">Trigger State</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="siteTableBody" class="divide-y divide-gray-800">
                        <!-- Disusun otomatis via app.js -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
